<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>StampCam Pro - Chụp Ảnh Đóng Dấu STT</title>

  <!-- PWA & iOS Safari Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StampCam">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">

  <!-- JSZip for Bulk Download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
      --accent-hover: #059669;
      --danger: #ef4444;
      --warning: #f59e0b;
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-glass: rgba(30, 41, 59, 0.85);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }

    /* Top Bar */
    header {
      background: var(--surface-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 16px;
      padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--border);
    }

    .header-title {
      font-size: 1.05rem;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-badge {
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 600;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    /* Main Container */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      padding: 12px 16px 80px;
      gap: 14px;
    }

    /* STT / Mã Sản Phẩm Control Card */
    .control-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }

    .card-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .input-group label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    input, select {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 10px;
      outline: none;
      transition: all 0.2s ease;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
    }

    .btn-step {
      background: #334155;
      color: #fff;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      font-size: 1.3rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.1s, background 0.2s;
    }

    .btn-step:active {
      transform: scale(0.92);
      background: #475569;
    }

    .quick-preview-tag {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0,0,0,0.3);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .preview-code {
      font-family: monospace;
      font-size: 1.15rem;
      font-weight: 800;
      color: #fbbf24;
      background: #000;
      padding: 3px 10px;
      border-radius: 6px;
      letter-spacing: 1px;
    }

    /* Camera Viewport */
    .camera-wrapper {
      position: relative;
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      aspect-ratio: 3 / 4;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Live Stamp Overlay on Viewport */
    .stamp-overlay {
      position: absolute;
      pointer-events: none;
      z-index: 10;
      transition: all 0.2s ease;
      max-width: 85%;
    }

    /* Positions */
    .pos-top-left { top: 14px; left: 14px; }
    .pos-top-right { top: 14px; right: 14px; }
    .pos-bottom-left { bottom: 14px; left: 14px; }
    .pos-bottom-right { bottom: 14px; right: 14px; }

    /* Stamp Styles */
    .stamp-badge {
      display: inline-flex;
      flex-direction: column;
      padding: 8px 16px;
      border-radius: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-shadow: 0 6px 20px rgba(0,0,0,0.65);
      line-height: 1.2;
    }

    .style-yellow {
      background: #fbbf24;
      color: #000;
      border: 2px solid #000;
    }
    .style-yellow .stamp-num { color: #000; }
    .style-yellow .stamp-sub { color: #262626; }
    .style-yellow .stamp-note { color: #1e3a8a; }

    .style-black {
      background: rgba(0, 0, 0, 0.88);
      color: #ffffff;
      border: 2px solid #38bdf8;
    }
    .style-black .stamp-num { color: #38bdf8; text-shadow: 0 0 8px rgba(56, 189, 248, 0.6); }
    .style-black .stamp-sub { color: #cbd5e1; }
    .style-black .stamp-note { color: #facc15; }

    .style-red {
      background: #dc2626;
      color: #ffffff;
      border: 2px solid #ffffff;
    }
    .style-red .stamp-num { color: #ffffff; }
    .style-red .stamp-sub { color: #fecaca; }
    .style-red .stamp-note { color: #fef08a; }

    .stamp-num {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 0.8px;
    }

    .stamp-note {
      font-size: 0.85rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .stamp-sub {
      font-size: 0.68rem;
      font-weight: 600;
      margin-top: 2px;
    }

    /* Camera Switch Button */
    .camera-top-actions {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 15;
    }

    .btn-icon-glass {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.15rem;
      transition: transform 0.1s;
    }

    .btn-icon-glass:active {
      transform: scale(0.9);
    }

    /* Camera Control Bottom Bar */
    .shutter-bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 10px 0;
      margin-top: 4px;
    }

    .btn-native-file {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-native-file span.icon {
      font-size: 1.35rem;
      color: #38bdf8;
    }

    .btn-shutter {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: #ffffff;
      border: 5px solid rgba(255, 255, 255, 0.3);
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.1s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .btn-shutter::after {
      content: '';
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #ffffff;
      border: 2px solid #0f172a;
      transition: transform 0.1s, background 0.1s;
    }

    .btn-shutter:active {
      transform: scale(0.94);
    }

    .btn-shutter:active::after {
      transform: scale(0.88);
      background: #3b82f6;
    }

    .gallery-preview-btn {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: var(--surface);
      border: 2px solid var(--border);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .gallery-preview-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-badge-count {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--primary);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      border: 2px solid var(--bg);
    }

    /* Settings Panel */
    .collapsible-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      padding: 4px 0;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.5);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      grid-column: span 2;
    }

    .toggle-group span {
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .2s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Modal Gallery / Preview */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      display: none;
      flex-direction: column;
      padding: 16px;
      padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .modal-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .modal-body img {
      max-width: 100%;
      max-height: 55vh;
      border-radius: 12px;
      border: 1px solid var(--border);
      object-fit: contain;
      user-select: auto;
      -webkit-user-select: auto;
    }

    .photo-hint {
      margin-top: 8px;
      font-size: 0.78rem;
      color: #94a3b8;
      background: rgba(0,0,0,0.5);
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .modal-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
      width: 100%;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-accent {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
      font-size: 1.05rem;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #334155; color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }

    /* Gallery Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      overflow-y: auto;
      max-height: 60vh;
      padding: 4px;
    }

    .gallery-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-item-tag {
      position: absolute;
      bottom: 2px;
      left: 2px;
      right: 2px;
      background: rgba(0,0,0,0.8);
      color: #fbbf24;
      font-size: 0.65rem;
      font-weight: bold;
      text-align: center;
      padding: 2px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Flash Effect */
    .flash-anim {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 30;
      transition: opacity 0.06s ease-out;
    }

    .flash-anim.active {
      opacity: 0.95;
    }

    #nativeFileInput {
      display: none;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-title">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
      <span>STAMPCAM PRO</span>
    </div>
    <div class="header-badge" id="cameraStatusBadge">Đang khởi động...</div>
  </header>

  <main>
    <!-- Số Thứ Tự & Mã Sản Phẩm -->
    <div class="control-card">
      <div class="card-row">
        <div class="input-group" style="flex: 1.1;">
          <label>Tiền tố (Mã)</label>
          <input type="text" id="prefixInput" value="SP-" placeholder="VD: SP-, MS-">
        </div>
        <div class="input-group" style="flex: 1.8;">
          <label>Số thứ tự (STT)</label>
          <div class="input-row">
            <button class="btn-step" id="btnDec" title="Giảm 1">-</button>
            <input type="number" id="seqInput" value="1" min="1" style="text-align: center;">
            <button class="btn-step" id="btnInc" title="Tăng 1">+</button>
          </div>
        </div>
      </div>

      <div class="input-group" style="margin-top: 10px;">
        <label>Ghi chú / Tên SP (Tùy chọn)</label>
        <input type="text" id="noteInput" placeholder="VD: Áo thun trắng - Size L">
      </div>

      <div class="quick-preview-tag">
        <span style="color: var(--text-muted);">Mẫu con dấu:</span>
        <span class="preview-code" id="previewCodeText">SP-0001</span>
      </div>
    </div>

    <!-- Khung Xem Trước Camera -->
    <div class="camera-wrapper" id="cameraWrapper">
      <div class="flash-anim" id="flashLayer"></div>

      <video id="videoPreview" playsinline autoplay muted></video>

      <!-- Live Stamp Overlay -->
      <div class="stamp-overlay pos-top-left style-yellow" id="liveStamp">
        <div class="stamp-badge">
          <span class="stamp-num" id="overlayStampNum">SP-0001</span>
          <span class="stamp-note" id="overlayStampNote" style="display: none;"></span>
          <span class="stamp-sub" id="overlayStampDate"></span>
        </div>
      </div>

      <!-- Action buttons on camera -->
      <div class="camera-top-actions">
        <button class="btn-icon-glass" id="btnSwitchCam" title="Đổi camera trước/sau">
          🔄
        </button>
      </div>
    </div>

    <!-- Shutter & Trigger Bar -->
    <div class="shutter-bar">
      <!-- Nút Chụp bằng Camera Gốc iPhone (Full Resolution 12MP/48MP) -->
      <label for="nativeFileInput" class="btn-native-file" title="Dùng Camera gốc iPhone để có độ nét tối đa">
        <span class="icon">📷</span>
        <span>Chụp Nét Cao</span>
      </label>
      <input type="file" id="nativeFileInput" accept="image/*" capture="environment">

      <!-- Nút Chụp Trực Tiếp -->
      <button class="btn-shutter" id="btnCapture" title="Chụp nhanh"></button>

      <!-- Xem Bộ Sưu Tập -->
      <div class="gallery-preview-btn" id="btnOpenGallery" title="Xem ảnh đã chụp">
        <span id="galleryEmptyIcon">🖼️</span>
        <img id="lastCapturedThumb" style="display: none;" alt="Thumb">
        <span class="gallery-badge-count" id="galleryCount" style="display: none;">0</span>
      </div>
    </div>

    <!-- Tùy Chọn Cài Đặt -->
    <div class="control-card">
      <div class="collapsible-header" id="settingsToggle">
        <span>⚙️ TÙY CHỌN ĐÓNG DẤU & LƯU ẢNH</span>
        <span id="settingsArrow">▼</span>
      </div>

      <div class="settings-grid" id="settingsContent">
        <div class="input-group">
          <label>Vị trí dấu</label>
          <select id="posSelect">
            <option value="top-left" selected>Góc Trên - Trái</option>
            <option value="top-right">Góc Trên - Phải</option>
            <option value="bottom-left">Góc Dưới - Trái</option>
            <option value="bottom-right">Góc Dưới - Phải</option>
          </select>
        </div>

        <div class="input-group">
          <label>Kiểu màu sắc</label>
          <select id="styleSelect">
            <option value="style-yellow" selected>Vàng Nổi Bật (Chữ đen)</option>
            <option value="style-black">Đen Sang Trọng (Chữ xanh)</option>
            <option value="style-red">Đỏ Cảnh Báo (Chữ trắng)</option>
          </select>
        </div>

        <div class="input-group">
          <label>Định dạng số (Số 0 đệm)</label>
          <select id="padSelect">
            <option value="4" selected>4 chữ số (0001)</option>
            <option value="3">3 chữ số (001)</option>
            <option value="2">2 chữ số (01)</option>
            <option value="0">Không đệm (1, 2, 3...)</option>
          </select>
        </div>

        <div class="input-group">
          <label>Cỡ chữ dấu</label>
          <select id="fontSizeSelect">
            <option value="normal">Vừa phải (Tiêu chuẩn)</option>
            <option value="large" selected>To Rõ Ràng</option>
            <option value="xlarge">Cực Đại (Siêu To)</option>
          </select>
        </div>

        <div class="toggle-group">
          <span>Tự động tăng STT (+1) sau khi chụp</span>
          <label class="switch">
            <input type="checkbox" id="autoIncSwitch" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="toggle-group">
          <span>In kèm ngày giờ chụp</span>
          <label class="switch">
            <input type="checkbox" id="showDateSwitch" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="toggle-group">
          <span>Âm thanh khi chụp</span>
          <label class="switch">
            <input type="checkbox" id="soundSwitch" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal Xem Lại Ảnh Vừa Chụp & Lưu Vào Thư Viện iPhone -->
  <div class="modal-backdrop" id="previewModal">
    <div class="modal-header">
      <h3 style="font-size: 1.1rem; font-weight: 700; color: #38bdf8;">Ảnh Vừa Đóng Dấu</h3>
      <button class="btn-icon-glass" id="btnClosePreview">✕</button>
    </div>
    <div class="modal-body">
      <img id="previewModalImg" src="" alt="Ảnh đóng dấu">
      <div class="photo-hint">
        💡 <span>Mẹo: Bạn có thể <b>Chạm & Giữ vào ảnh</b> để chọn "Lưu vào Ảnh"</span>
      </div>
    </div>
    <div class="modal-footer">
      <!-- Nút ưu tiên lưu thẳng vào thư viện ảnh iPhone (Photos Album) -->
      <button class="btn btn-accent" id="btnSaveToPhotos">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <span>📲 Lưu Vào Thư Viện Ảnh (Photos)</span>
      </button>

      <div style="display: flex; gap: 8px;">
        <button class="btn btn-secondary" id="btnRetake">📸 Chụp tiếp</button>
        <button class="btn btn-primary" id="btnDownloadSingle">⬇️ Tải file</button>
      </div>
    </div>
  </div>

  <!-- Modal Bộ Sưu Tập Ảnh -->
  <div class="modal-backdrop" id="galleryModal">
    <div class="modal-header">
      <h3 style="font-size: 1.1rem; font-weight: 700; color: #fff;">Danh Sách Ảnh (<span id="modalGalleryCount">0</span>)</h3>
      <button class="btn-icon-glass" id="btnCloseGallery">✕</button>
    </div>
    <div class="modal-body" style="justify-content: flex-start;">
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
    <div class="modal-footer" style="flex-direction: column;">
      <div style="display: flex; gap: 8px; width: 100%;">
        <button class="btn btn-danger" id="btnClearGallery">Xóa tất cả</button>
        <button class="btn btn-accent" id="btnDownloadZip">📦 Tải tất cả (File ZIP)</button>
      </div>
    </div>
  </div>

  <canvas id="stampCanvas" style="display: none;"></canvas>
  <div class="toast" id="toastMsg">Thông báo</div>

  <script>
    const state = {
      stream: null,
      facingMode: 'environment',
      capturedPhotos: [],
      currentPhotoDataUrl: null,
      currentPhotoCode: ''
    };

    const video = document.getElementById('videoPreview');
    const prefixInput = document.getElementById('prefixInput');
    const seqInput = document.getElementById('seqInput');
    const noteInput = document.getElementById('noteInput');
    const btnInc = document.getElementById('btnInc');
    const btnDec = document.getElementById('btnDec');
    const previewCodeText = document.getElementById('previewCodeText');
    const overlayStampNum = document.getElementById('overlayStampNum');
    const overlayStampNote = document.getElementById('overlayStampNote');
    const overlayStampDate = document.getElementById('overlayStampDate');
    const liveStamp = document.getElementById('liveStamp');
    const posSelect = document.getElementById('posSelect');
    const styleSelect = document.getElementById('styleSelect');
    const padSelect = document.getElementById('padSelect');
    const fontSizeSelect = document.getElementById('fontSizeSelect');
    const autoIncSwitch = document.getElementById('autoIncSwitch');
    const showDateSwitch = document.getElementById('showDateSwitch');
    const soundSwitch = document.getElementById('soundSwitch');
    const btnCapture = document.getElementById('btnCapture');
    const nativeFileInput = document.getElementById('nativeFileInput');
    const btnSwitchCam = document.getElementById('btnSwitchCam');
    const flashLayer = document.getElementById('flashLayer');
    const cameraStatusBadge = document.getElementById('cameraStatusBadge');

    const previewModal = document.getElementById('previewModal');
    const previewModalImg = document.getElementById('previewModalImg');
    const btnClosePreview = document.getElementById('btnClosePreview');
    const btnRetake = document.getElementById('btnRetake');
    const btnSaveToPhotos = document.getElementById('btnSaveToPhotos');
    const btnDownloadSingle = document.getElementById('btnDownloadSingle');

    const galleryModal = document.getElementById('galleryModal');
    const btnOpenGallery = document.getElementById('btnOpenGallery');
    const btnCloseGallery = document.getElementById('btnCloseGallery');
    const galleryGrid = document.getElementById('galleryGrid');
    const lastCapturedThumb = document.getElementById('lastCapturedThumb');
    const galleryEmptyIcon = document.getElementById('galleryEmptyIcon');
    const galleryCount = document.getElementById('galleryCount');
    const modalGalleryCount = document.getElementById('modalGalleryCount');
    const btnClearGallery = document.getElementById('btnClearGallery');
    const btnDownloadZip = document.getElementById('btnDownloadZip');

    const toastMsg = document.getElementById('toastMsg');
    const canvas = document.getElementById('stampCanvas');
    const ctx = canvas.getContext('2d');

    // Âm thanh chụp bằng Web Audio API
    let audioCtx = null;
    function playShutterSound() {
      if (!soundSwitch.checked) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {}
    }

    function getFormattedCode() {
      const prefix = prefixInput.value.trim();
      let num = parseInt(seqInput.value, 10);
      if (isNaN(num) || num < 1) num = 1;

      const padLen = parseInt(padSelect.value, 10);
      let numStr = num.toString();
      if (padLen > 0) numStr = numStr.padStart(padLen, '0');
      return `${prefix}${numStr}`;
    }

    function getFormattedDateTime() {
      const now = new Date();
      const d = String(now.getDate()).padStart(2, '0');
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const y = now.getFullYear();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      return `${d}/${m}/${y} ${hh}:${mm}:${ss}`;
    }

    function updateLivePreview() {
      const code = getFormattedCode();
      const note = noteInput.value.trim();

      previewCodeText.textContent = note ? `${code} - ${note}` : code;
      overlayStampNum.textContent = code;

      if (note) {
        overlayStampNote.textContent = note;
        overlayStampNote.style.display = 'block';
      } else {
        overlayStampNote.style.display = 'none';
      }

      if (showDateSwitch.checked) {
        overlayStampDate.textContent = getFormattedDateTime();
        overlayStampDate.style.display = 'block';
      } else {
        overlayStampDate.style.display = 'none';
      }

      liveStamp.className = `stamp-overlay pos-${posSelect.value} ${styleSelect.value}`;
    }

    setInterval(() => {
      if (showDateSwitch.checked) overlayStampDate.textContent = getFormattedDateTime();
    }, 1000);

    function showToast(msg) {
      toastMsg.textContent = msg;
      toastMsg.classList.add('show');
      setTimeout(() => toastMsg.classList.remove('show'), 2500);
    }

    async function startCamera() {
      try {
        if (state.stream) state.stream.getTracks().forEach(t => t.stop());
        cameraStatusBadge.textContent = 'Đang mở cam...';

        const constraints = {
          video: { facingMode: state.facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        state.stream = stream;
        video.srcObject = stream;
        cameraStatusBadge.textContent = state.facingMode === 'environment' ? 'Camera Sau' : 'Camera Trước';
        cameraStatusBadge.style.color = '#38bdf8';
      } catch (err) {
        cameraStatusBadge.textContent = 'Chế độ Chụp File';
        cameraStatusBadge.style.color = '#fbbf24';
      }
    }

    btnSwitchCam.addEventListener('click', () => {
      state.facingMode = state.facingMode === 'environment' ? 'user' : 'environment';
      startCamera();
    });

    btnInc.addEventListener('click', () => {
      seqInput.value = parseInt(seqInput.value || 0, 10) + 1;
      updateLivePreview();
    });

    btnDec.addEventListener('click', () => {
      const val = parseInt(seqInput.value || 1, 10);
      if (val > 1) {
        seqInput.value = val - 1;
        updateLivePreview();
      }
    });

    [prefixInput, seqInput, noteInput, posSelect, styleSelect, padSelect, fontSizeSelect, showDateSwitch].forEach(el => {
      el.addEventListener('input', updateLivePreview);
      el.addEventListener('change', updateLivePreview);
    });

    function triggerShutterFeedback() {
      playShutterSound();
      flashLayer.classList.add('active');
      setTimeout(() => flashLayer.classList.remove('active'), 100);
      if (navigator.vibrate) navigator.vibrate(60);
    }

    function drawStampOnCanvas(sourceImgOrVideo, width, height) {
      canvas.width = width;
      canvas.height = height;

      ctx.drawImage(sourceImgOrVideo, 0, 0, width, height);

      const code = getFormattedCode();
      const noteText = noteInput.value.trim();
      const dateText = showDateSwitch.checked ? getFormattedDateTime() : '';
      const pos = posSelect.value;
      const style = styleSelect.value;
      const fontSizeMode = fontSizeSelect.value;

      let baseFontSize = Math.max(32, Math.round(width * 0.045));
      if (fontSizeMode === 'large') baseFontSize = Math.round(baseFontSize * 1.35);
      if (fontSizeMode === 'xlarge') baseFontSize = Math.round(baseFontSize * 1.8);

      const noteFontSize = Math.max(18, Math.round(baseFontSize * 0.55));
      const subFontSize = Math.max(14, Math.round(baseFontSize * 0.42));
      const padding = Math.round(baseFontSize * 0.45);
      const margin = Math.round(width * 0.035);

      ctx.font = `900 ${baseFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      const codeMetrics = ctx.measureText(code);

      ctx.font = `700 ${noteFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      const noteMetrics = noteText ? ctx.measureText(noteText) : { width: 0 };

      ctx.font = `600 ${subFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      const dateMetrics = dateText ? ctx.measureText(dateText) : { width: 0 };

      const badgeWidth = Math.max(codeMetrics.width, noteMetrics.width, dateMetrics.width) + padding * 2.2;
      let badgeHeight = baseFontSize + padding * 1.4;
      if (noteText) badgeHeight += noteFontSize + 6;
      if (dateText) badgeHeight += subFontSize + 6;

      let boxX = margin;
      let boxY = margin;

      if (pos === 'top-right') {
        boxX = width - badgeWidth - margin;
        boxY = margin;
      } else if (pos === 'bottom-left') {
        boxX = margin;
        boxY = height - badgeHeight - margin;
      } else if (pos === 'bottom-right') {
        boxX = width - badgeWidth - margin;
        boxY = height - badgeHeight - margin;
      }

      let bgColor = 'rgba(0, 0, 0, 0.88)';
      let borderColor = '#38bdf8';
      let textCodeColor = '#38bdf8';
      let textNoteColor = '#facc15';
      let textDateColor = '#cbd5e1';

      if (style === 'style-yellow') {
        bgColor = '#fbbf24';
        borderColor = '#000000';
        textCodeColor = '#000000';
        textNoteColor = '#1e3a8a';
        textDateColor = '#262626';
      } else if (style === 'style-red') {
        bgColor = '#dc2626';
        borderColor = '#ffffff';
        textCodeColor = '#ffffff';
        textNoteColor = '#fef08a';
        textDateColor = '#fecaca';
      }

      const radius = Math.round(baseFontSize * 0.35);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(boxX + radius, boxY);
      ctx.lineTo(boxX + badgeWidth - radius, boxY);
      ctx.quadraticCurveTo(boxX + badgeWidth, boxY, boxX + badgeWidth, boxY + radius);
      ctx.lineTo(boxX + badgeWidth, boxY + badgeHeight - radius);
      ctx.quadraticCurveTo(boxX + badgeWidth, boxY + badgeHeight, boxX + badgeWidth - radius, boxY + badgeHeight);
      ctx.lineTo(boxX + radius, boxY + badgeHeight);
      ctx.quadraticCurveTo(boxX, boxY + badgeHeight, boxX, boxY + badgeHeight - radius);
      ctx.lineTo(boxX, boxY + radius);
      ctx.quadraticCurveTo(boxX, boxY, boxX + radius, boxY);
      ctx.closePath();

      ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
      ctx.shadowBlur = 18;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 5;

      ctx.fillStyle = bgColor;
      ctx.fill();

      ctx.shadowColor = 'transparent';
      ctx.lineWidth = Math.max(3, Math.round(baseFontSize * 0.08));
      ctx.strokeStyle = borderColor;
      ctx.stroke();

      let currentY = boxY + padding * 0.8;

      ctx.fillStyle = textCodeColor;
      ctx.font = `900 ${baseFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      ctx.textBaseline = 'top';
      ctx.fillText(code, boxX + padding, currentY);
      currentY += baseFontSize + 4;

      if (noteText) {
        ctx.fillStyle = textNoteColor;
        ctx.font = `700 ${noteFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        ctx.fillText(noteText, boxX + padding, currentY);
        currentY += noteFontSize + 4;
      }

      if (dateText) {
        ctx.fillStyle = textDateColor;
        ctx.font = `600 ${subFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        ctx.fillText(dateText, boxX + padding, currentY);
      }

      ctx.restore();
    }

    function onPhotoProcessed(dataUrl, code) {
      state.currentPhotoDataUrl = dataUrl;
      state.currentPhotoCode = code;

      state.capturedPhotos.unshift({ dataUrl, code, timestamp: Date.now() });

      lastCapturedThumb.src = dataUrl;
      lastCapturedThumb.style.display = 'block';
      galleryEmptyIcon.style.display = 'none';
      galleryCount.textContent = state.capturedPhotos.length;
      galleryCount.style.display = 'block';

      if (autoIncSwitch.checked) {
        seqInput.value = parseInt(seqInput.value || 0, 10) + 1;
        updateLivePreview();
      }

      previewModalImg.src = dataUrl;
      previewModal.style.display = 'flex';
      showToast(`Đã đóng dấu: ${code}`);
    }

    btnCapture.addEventListener('click', () => {
      if (!video.videoWidth || !video.videoHeight) {
        showToast('Camera chưa sẵn sàng!');
        return;
      }
      triggerShutterFeedback();
      const code = getFormattedCode();
      drawStampOnCanvas(video, video.videoWidth, video.videoHeight);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
      onPhotoProcessed(dataUrl, code);
    });

    nativeFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const code = getFormattedCode();
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          triggerShutterFeedback();
          drawStampOnCanvas(img, img.naturalWidth, img.naturalHeight);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
          onPhotoProcessed(dataUrl, code);
          nativeFileInput.value = '';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 📲 LƯU THẲNG VÀO THƯ VIỆN ẢNH IPHONE (PHOTOS APP)
    async function saveImageToIPhonePhotos() {
      if (!state.currentPhotoDataUrl) return;

      try {
        const res = await fetch(state.currentPhotoDataUrl);
        const blob = await res.blob();
        const file = new File([blob], `${state.currentPhotoCode}.jpg`, { type: 'image/jpeg' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          // Kích hoạt bảng chia sẻ iOS -> người dùng chạm "Lưu hình ảnh" (Save Image)
          await navigator.share({
            files: [file],
            title: state.currentPhotoCode
          });
        } else {
          // Fallback tải xuống nếu không hỗ trợ Web Share
          btnDownloadSingle.click();
        }
      } catch (err) {
        // Nếu người dùng đóng bảng chia sẻ
        console.log('Share dismissed:', err);
      }
    }

    btnSaveToPhotos.addEventListener('click', saveImageToIPhonePhotos);

    // Tải file trực tiếp
    btnDownloadSingle.addEventListener('click', () => {
      if (!state.currentPhotoDataUrl) return;
      const link = document.createElement('a');
      link.download = `${state.currentPhotoCode}_${Date.now()}.jpg`;
      link.href = state.currentPhotoDataUrl;
      link.click();
      showToast('Đã tải ảnh về máy!');
    });

    btnClosePreview.addEventListener('click', () => previewModal.style.display = 'none');
    btnRetake.addEventListener('click', () => previewModal.style.display = 'none');

    btnOpenGallery.addEventListener('click', () => {
      if (state.capturedPhotos.length === 0) {
        showToast('Chưa có ảnh nào được chụp!');
        return;
      }

      modalGalleryCount.textContent = state.capturedPhotos.length;
      galleryGrid.innerHTML = '';

      state.capturedPhotos.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'gallery-item';
        div.innerHTML = `
          <img src="${item.dataUrl}" alt="${item.code}">
          <div class="gallery-item-tag">${item.code}</div>
        `;
        div.addEventListener('click', () => {
          state.currentPhotoDataUrl = item.dataUrl;
          state.currentPhotoCode = item.code;
          previewModalImg.src = item.dataUrl;
          galleryModal.style.display = 'none';
          previewModal.style.display = 'flex';
        });
        galleryGrid.appendChild(div);
      });

      galleryModal.style.display = 'flex';
    });

    btnCloseGallery.addEventListener('click', () => galleryModal.style.display = 'none');

    btnClearGallery.addEventListener('click', () => {
      if (confirm('Bạn có chắc muốn xóa tất cả ảnh đã chụp?')) {
        state.capturedPhotos = [];
        lastCapturedThumb.style.display = 'none';
        galleryEmptyIcon.style.display = 'block';
        galleryCount.style.display = 'none';
        galleryModal.style.display = 'none';
        showToast('Đã xóa bộ sưu tập.');
      }
    });

    btnDownloadZip.addEventListener('click', async () => {
      if (state.capturedPhotos.length === 0) return;

      showToast('Đang đóng gói file ZIP...');
      const zip = new JSZip();
      const folder = zip.folder("photos");

      state.capturedPhotos.forEach((item, index) => {
        const base64Data = item.dataUrl.replace(/^data:image\/jpeg;base64,/, "");
        folder.file(`${item.code}_${index + 1}.jpg`, base64Data, { base64: true });
      });

      const content = await zip.generateAsync({ type: "blob" });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(content);
      link.download = `Danh_Sach_SanPham_${Date.now()}.zip`;
      link.click();
      showToast('Đã tải xong file ZIP!');
    });

    const settingsToggle = document.getElementById('settingsToggle');
    const settingsContent = document.getElementById('settingsContent');
    const settingsArrow = document.getElementById('settingsArrow');
    let isSettingsOpen = true;

    settingsToggle.addEventListener('click', () => {
      isSettingsOpen = !isSettingsOpen;
      settingsContent.style.display = isSettingsOpen ? 'grid' : 'none';
      settingsArrow.textContent = isSettingsOpen ? '▼' : '▶';
    });

    updateLivePreview();
    startCamera();
  </script>
</body>
</html>
